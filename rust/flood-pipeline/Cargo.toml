[package]
name = "flood-pipeline"
version = "0.1.0"
edition = "2021"
description = "Flood Explorer's data pipeline: fetches gauges, floods, sea levels, levees, tides and more, and builds the terrain for the site."
license = "MIT"
publish = false

[[bin]]
name = "flood"
path = "src/main.rs"

[dependencies]
ureq = "2.12"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tiff = "0.9"
png = "0.17"
miniz_oxide = "0.8"
regex = "1"
# The RustGIS / GeoLibre hydrology tools (whitebox_next_gen), pinned to the
# commit inside GeoLibre 1.6.0. Not on crates.io (publish = false).
wbcore = { git = "https://github.com/opengeos/whitebox-wasm", rev = "6b2a6eb99743b5f1602c7b7a1ff724fea6ee1b23" }
wbtools_oss = { git = "https://github.com/opengeos/whitebox-wasm", rev = "6b2a6eb99743b5f1602c7b7a1ff724fea6ee1b23" }
