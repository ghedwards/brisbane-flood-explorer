name: Build terrain and publish viewer

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # refresh Google Flood Hub forecasts every three hours
    - cron: "17 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the flood model
        run: node --test tests/core.test.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Test the data fetchers
        run: python -m unittest tests/test_floodhub.py tests/test_national.py tests/test_council.py

      # Terrain only needs rebuilding when the area or the pipeline changes.
      - name: Restore built terrain
        id: terrain
        uses: actions/cache@v4
        with:
          path: |
            work/brisbane/*.tif
          key: terrain-${{ hashFiles('config/brisbane.json', 'pipeline/fetch_dem.py', 'pipeline/run_hydrology.sh', 'pipeline/install_geolibre.sh') }}

      - name: Install the GeoLibre runner (RustGIS hydrology tools)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipeline/install_geolibre.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache DEM tiles
        if: steps.terrain.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: work/brisbane/tiles
          key: glo30-${{ hashFiles('config/brisbane.json') }}

      - name: Fetch DEM (Copernicus GLO-30)
        id: dem
        if: steps.terrain.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python pipeline/fetch_dem.py config/brisbane.json work/brisbane

      - name: Run hydrology with GeoLibre
        id: hydro
        if: steps.terrain.outputs.cache-hit != 'true' && steps.dem.outcome == 'success'
        continue-on-error: true
        run: pipeline/run_hydrology.sh config/brisbane.json work/brisbane

      - name: Assemble site
        run: |
          mkdir -p site/data
          cp viewer/index.html viewer/app.js viewer/flood-core.js viewer/flood-worker.js site/
          if [ -f work/brisbane/dem.tif ] && [ -f work/brisbane/d8.tif ]; then
            python pipeline/export_viewer.py config/brisbane.json work/brisbane site/data
          else
            echo "::warning::Brisbane terrain was not built; the site will show the sample terrain only."
            rm -f work/brisbane/*.tif  # never cache a partial build
          fi

      - name: Fetch national BoM gauges, dams and readings
        id: national
        continue-on-error: true
        run: python pipeline/fetch_national.py site/data/national | tee national.log

      # Dam water history builds up across runs: restore the latest copy,
      # spend at most ~5 minutes filling in or refreshing dams, save again.
      - name: Restore dam water history
        uses: actions/cache/restore@v4
        with:
          path: cache/waterhistory.json
          key: waterhistory-${{ github.run_id }}
          restore-keys: waterhistory-

      - name: Fetch dam water history (time-limited)
        id: whfetch
        if: steps.national.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        env:
          WATERHISTORY_BUDGET_S: "300"
        run: |
          python pipeline/fetch_waterhistory.py site/data/national cache/waterhistory.json | tee wh.log
          mkdir -p cache && cp site/data/national/waterhistory.json cache/waterhistory.json

      - name: Save dam water history
        if: always() && hashFiles('cache/waterhistory.json') != ''
        uses: actions/cache/save@v4
        with:
          path: cache/waterhistory.json
          key: waterhistory-${{ github.run_id }}

      - name: Publish previous water history if this run fetched none
        if: steps.whfetch.outcome != 'success' && hashFiles('cache/waterhistory.json') != ''
        run: cp cache/waterhistory.json site/data/national/waterhistory.json

      - name: Month for the council-image cache
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore council flood images
        id: council
        uses: actions/cache@v4
        with:
          path: cache/council
          key: council-${{ steps.month.outputs.month }}-${{ hashFiles('pipeline/render_council_layers.py') }}

      - name: Render council flood images (monthly)
        if: steps.council.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python pipeline/render_council_layers.py cache/council | tee council.log
          python -c "import json,sys; m=json.load(open('cache/council/council.json')); sys.exit(0 if len(m['layers'])==2 else 1)" || rm -rf cache/council

      - name: Publish council flood images
        run: |
          if [ -f cache/council/council.json ]; then mkdir -p site/data/council && cp cache/council/* site/data/council/; fi
          echo "::notice::Council images: $(grep -E '^(creek|overland):|^warning' council.log 2>/dev/null | tr '\n' ' ' || echo 'from cache')"

      - name: Restore DEA national images
        id: dea
        uses: actions/cache@v4
        with:
          path: cache/dea
          key: dea-${{ steps.month.outputs.month }}-${{ hashFiles('pipeline/render_dea_mosaic.py') }}

      - name: Stitch DEA national images (monthly)
        if: steps.dea.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: python pipeline/render_dea_mosaic.py cache/dea | tee dea.log || rm -rf cache/dea

      - name: Publish DEA national images
        run: |
          if [ -f cache/dea/dea.json ]; then mkdir -p site/data/dea && cp cache/dea/* site/data/dea/; fi
          echo "::notice::$(grep -E '^DEA mosaic' dea.log 2>/dev/null || echo 'DEA mosaic: from cache')"

      - name: Fetch Google Flood Hub forecasts
        id: floodhub
        continue-on-error: true
        env:
          FLOOD_FORECASTING_API_KEY: ${{ secrets.FLOOD_FORECASTING_API_KEY }}
        run: python pipeline/fetch_floodhub.py config/brisbane.json site/data | tee floodhub.log

      - name: Build summary
        run: |
          {
            echo "### Build summary"
            echo "- Terrain from cache: ${{ steps.terrain.outputs.cache-hit || 'false' }}"
            echo "- DEM download: ${{ steps.dem.outcome || 'skipped' }}"
            echo "- GeoLibre hydrology: ${{ steps.hydro.outcome || 'skipped' }}"
            echo "- National BoM data: ${{ steps.national.outcome }} — $(grep '^National' national.log 2>/dev/null)"
            echo "- Flood Hub: ${{ steps.floodhub.outcome }} — $(tail -n1 floodhub.log 2>/dev/null)"
            du -sh site/data/* 2>/dev/null | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::$(tail -n1 floodhub.log 2>/dev/null)"
          echo "::notice::$(grep '^National' national.log 2>/dev/null)"
          echo "::notice::$(grep '^Water history' wh.log 2>/dev/null || echo 'Water history: not fetched this run')"
          grep '^warning:' wh.log 2>/dev/null | head -2 | sed 's/^warning:/::warning::Water history: /' || true
          grep '^warning:' national.log 2>/dev/null | head -3 | sed 's/^warning:/::warning::National data: /' || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Check the live interactive map
        run: |
          sleep 20  # let Pages finish propagating
          python tests/smoke_live.py "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - name: Probe national data sources from the browser
        if: always()
        run: python tests/probe_sources.py "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke*.png
