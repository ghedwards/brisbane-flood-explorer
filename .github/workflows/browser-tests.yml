name: Browser checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-tests.yml'
      - '.github/workflows/build.yml'
  workflow_call:
    inputs:
      site_url:
        type: string
        required: true
      presets:
        type: string
        default: quick
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check the live interactive map
        env:
          SITE_URL: ${{ inputs.site_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          SMOKE_PRESETS: ${{ inputs.presets || 'quick' }}
        run: |
          sleep 20  # allow a just-published Pages deployment to propagate
          npm run test:smoke -- "$SITE_URL"
      - name: Probe national data sources from the browser
        if: always()
        env:
          SITE_URL: ${{ inputs.site_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: npm run test:sources -- "$SITE_URL"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots
          path: smoke*.png
