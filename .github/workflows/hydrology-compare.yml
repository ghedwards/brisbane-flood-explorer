name: Compare in-process hydrology with GeoLibre

# Runs the Brisbane hydrology twice on the same dem.tif: with the separate
# geolibre program (pipeline/run_hydrology.sh) and inside flood (`flood
# hydrology`), and compares every raster cell by cell.
on:
  push:
    branches: [hydrology-inprocess]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-hydro-${{ hashFiles('rust/**/*.rs', 'rust/**/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: rust-hydro-
      - name: Build and test flood
        working-directory: rust
        run: |
          cargo test --release -p flood-pipeline 2> test.log || { grep -E "^error|panicked|FAILED" -A3 test.log | head -20 | sed 's/^/::error::/'; exit 1; }
          cargo build --release -p flood-pipeline
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: GeoLibre runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipeline/install_geolibre.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Hydrology both ways
        run: |
          flood dem config/brisbane.json work/a
          mkdir -p work/b && cp work/a/dem.tif work/b/
          s=$(date +%s); pipeline/run_hydrology.sh config/brisbane.json work/a > a.log; ta=$(( $(date +%s) - s ))
          s=$(date +%s); flood hydrology config/brisbane.json work/b > b.log; tb=$(( $(date +%s) - s ))
          echo "::notice::geolibre program: ${ta} s; in flood: ${tb} s ($(tail -1 b.log))"
      - name: Compare
        run: |
          pip install --quiet rasterio numpy
          python - <<'EOF'
          import numpy as np, rasterio
          for name in ["dem_breached", "dem_cond", "d8", "acc", "streams", "hand"]:
              a, b = rasterio.open(f"work/a/{name}.tif"), rasterio.open(f"work/b/{name}.tif")
              x, y = a.read(1).astype("float64"), b.read(1).astype("float64")
              same_grid = a.shape == b.shape and a.transform == b.transform and a.crs == b.crs
              if x.shape != y.shape:
                  print(f"::warning::{name}: grid {x.shape} vs {y.shape}"); continue
              exact = int((x == y).sum()) + int((np.isnan(x) & np.isnan(y)).sum())
              d = np.abs(x - y); d = d[np.isfinite(d)]
              level = "notice" if exact == x.size and same_grid else "warning"
              print(f"::{level}::{name}: {exact} of {x.size} cells identical; grid/CRS match {same_grid}; max diff {d.max() if d.size else 0:.6g}; nodata {a.nodata} vs {b.nodata}; dtype {a.dtypes[0]} vs {b.dtypes[0]}")
          EOF
      - name: Export from the in-process run
        run: |
          flood export config/brisbane.json work/b site/data
          python -c "import json; m = json.load(open('site/data/brisbane/meta.json')); print('::notice::processedWith:', m['processedWith'], '| gauge', m['gauge'])"
